name: Tech News Bot

on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"

  workflow_dispatch:

jobs:
  run-tech-news-bot:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # VALIDATE AND NORMALIZE API KEYS
      # =====================================================

      - name: Validate API Key Formatting
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          for name in ("GROQ_API_KEY", "NVIDIA_API_KEY"):
              value = os.environ.get(name, "")

              if not value:
                  print(f"FAIL: {name} is missing.")
                  sys.exit(1)

              # Remove accidental leading/trailing whitespace only.
              cleaned = value.strip()

              # Reject whitespace/control characters inside the key.
              if any(
                  ch.isspace() or ord(ch) < 32 or ord(ch) == 127
                  for ch in cleaned
              ):
                  print(f"FAIL: {name} contains internal whitespace/control characters.")
                  sys.exit(1)

              print(f"{name}: configured; formatting check passed.")

          print("API key formatting validation passed.")
          PY

      # =====================================================
      # DIAGNOSE GROQ API
      # =====================================================

      - name: Diagnose Groq API connection
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import socket
          import urllib.request
          import urllib.error
          import ssl

          print("=" * 55)
          print("GROQ API CONNECTION DIAGNOSTIC")
          print("=" * 55)

          api_key = os.environ.get("GROQ_API_KEY", "").strip()

          if not api_key:
              print("FAIL: GROQ_API_KEY is missing")
              raise SystemExit(1)

          print("API key is configured.")
          print("Testing HTTPS connection...")

          url = "https://api.groq.com/openai/v1/models"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "User-Agent": "TechNewsBot/1.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  print("HTTPS connection: SUCCESS")
                  print("HTTP status:", response.status)

          except urllib.error.HTTPError as error:
              print("HTTPS connection reached the server.")
              print("HTTP status:", error.code)
              print("Response reason:", error.reason)

          except urllib.error.URLError as error:
              print("HTTPS connection: FAILED")
              print("Reason:", repr(error.reason))
              raise

          except ssl.SSLError as error:
              print("TLS/SSL error:", repr(error))
              raise

          except socket.gaierror as error:
              print("DNS resolution error:", repr(error))
              raise

          except TimeoutError as error:
              print("Connection timed out:", repr(error))
              raise

          except Exception as error:
              print("Unexpected error:", type(error).__name__, repr(error))
              raise

          print("Groq diagnostic completed.")
          PY

      # =====================================================
      # DIAGNOSE NVIDIA API
      # =====================================================

      - name: Diagnose NVIDIA API connection
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import socket
          import urllib.request
          import urllib.error
          import ssl

          print("=" * 55)
          print("NVIDIA API CONNECTION DIAGNOSTIC")
          print("=" * 55)

          api_key = os.environ.get("NVIDIA_API_KEY", "").strip()

          if not api_key:
              print("FAIL: NVIDIA_API_KEY is missing")
              raise SystemExit(1)

          print("API key is configured.")
          print("Testing HTTPS connection...")

          url = "https://integrate.api.nvidia.com/v1/models"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "User-Agent": "TechNewsBot/1.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  print("HTTPS connection: SUCCESS")
                  print("HTTP status:", response.status)

          except urllib.error.HTTPError as error:
              print("HTTPS connection reached the server.")
              print("HTTP status:", error.code)
              print("Response reason:", error.reason)

          except urllib.error.URLError as error:
              print("HTTPS connection: FAILED")
              print("Reason:", repr(error.reason))
              raise

          except ssl.SSLError as error:
              print("TLS/SSL error:", repr(error))
              raise

          except socket.gaierror as error:
              print("DNS resolution error:", repr(error))
              raise

          except TimeoutError as error:
              print("Connection timed out:", repr(error))
              raise

          except Exception as error:
              print("Unexpected error:", type(error).__name__, repr(error))
              raise

          print("NVIDIA diagnostic completed.")
          PY

      # =====================================================
      # RUN TECH NEWS BOT
      # =====================================================

      - name: Run Tech News Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

        run: |
          # Normalize trailing newline/whitespace in API key secrets.
          export GROQ_API_KEY="$(printf '%s' "$GROQ_API_KEY" | tr -d '\r\n' | xargs)"
          export NVIDIA_API_KEY="$(printf '%s' "$NVIDIA_API_KEY" | tr -d '\r\n' | xargs)"

          python -m app.main
