name: Tech News Bot

on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"

  workflow_dispatch:


jobs:

  run-tech-news-bot:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================================
      # TEST GROQ API
      # =====================================================

      - name: Test Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |

          echo "=========================================="
          echo "TESTING GROQ API"
          echo "=========================================="

          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY is EMPTY"
            exit 1
          fi

          echo "✓ GROQ_API_KEY exists"
          echo "Testing api.groq.com..."

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            --max-time 30 \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            "https://api.groq.com/openai/v1/models")

          echo "$RESPONSE"

          echo ""
          echo "=========================================="
          echo "GROQ TEST COMPLETED"
          echo "=========================================="


      # =====================================================
      # TEST NVIDIA API
      # =====================================================

      - name: Test NVIDIA API
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

        run: |

          echo "=========================================="
          echo "TESTING NVIDIA API"
          echo "=========================================="

          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "❌ NVIDIA_API_KEY is EMPTY"
            exit 1
          fi

          echo "✓ NVIDIA_API_KEY exists"
          echo "Testing integrate.api.nvidia.com..."

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            --max-time 30 \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            "https://integrate.api.nvidia.com/v1/models")

          echo "$RESPONSE"

          echo ""
          echo "=========================================="
          echo "NVIDIA TEST COMPLETED"
          echo "=========================================="


      # =====================================================
      # RUN TECH NEWS BOT
      # =====================================================

      - name: Run Tech News Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

        run: |
          python -m app.main
